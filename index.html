<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shoreline Cleanup Data Explorer - Ontario</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
html,body,#map{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;color:#17202a}#map{background:#eef3f5}.panel{position:absolute;z-index:1000;top:18px;right:18px;width:340px;max-height:calc(100% - 36px);overflow:auto;background:#fff;border-radius:12px;box-shadow:0 4px 20px #0003;padding:18px;box-sizing:border-box}.panel h1{font-size:20px;margin:0 0 4px;color:#173f73}.sub{font-size:12px;color:#5c6875;margin-bottom:14px}.label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:13px 0 6px}.seg{display:flex;gap:5px}.seg button{flex:1;border:1px solid #cbd3dc;background:#f7f8fa;border-radius:7px;padding:8px 5px;cursor:pointer;font-size:12px}.seg button.on{background:#4B5EAA;color:#fff;border-color:#4B5EAA}select,input[type=text]{width:100%;box-sizing:border-box;border:1px solid #cbd3dc;border-radius:7px;padding:9px;background:#fff}.rangebox{position:relative;height:38px;margin:3px 2px 0}.rangebox input[type=range]{position:absolute;left:0;right:0;width:100%;pointer-events:none;appearance:none;background:transparent}.rangebox input[type=range]::-webkit-slider-thumb{pointer-events:auto;appearance:none;width:16px;height:16px;border-radius:50%;background:#4B5EAA;cursor:pointer}.track{position:absolute;top:8px;left:7px;right:7px;height:5px;background:#d9deea;border-radius:4px}.years{display:flex;justify-content:space-between;font-size:12px;font-weight:700}.legend{margin-top:14px;border-top:1px solid #e4e7eb;padding-top:12px}.legrow{display:flex;align-items:center;gap:8px;font-size:12px;margin:5px 0}.sw{width:20px;height:14px;border:1px solid #7775}.hint{font-size:11px;color:#6b7280;margin-top:7px}.leaflet-popup-content{font-size:13px;line-height:1.45}.leaflet-popup-content b{font-size:14px}.search-results{display:none;background:#fff;border:1px solid #d5dbe3;border-top:0;max-height:150px;overflow:auto}.search-results div{padding:7px 9px;font-size:12px;cursor:pointer}.search-results div:hover{background:#f0f2f7}@media(max-width:700px){.panel{top:auto;bottom:10px;right:10px;left:10px;width:auto;max-height:48%;padding:14px}}
</style></head><body><div id="map"></div><div class="panel"><h1>Shoreline Cleanup Data Explorer</h1><div class="sub">Explore cleanup activity and litter trends across Ontario.</div>
<div class="label">Search</div><input id="search" type="text" placeholder="Search neighbourhood or municipality…"><div id="results" class="search-results"></div>
<div class="label">Geography</div><div class="seg"><button id="gt" class="on">Toronto Neighbourhoods</button><button id="go">Ontario Municipalities</button></div>
<div class="label">Metric</div><select id="metric"><option>Cleanups Hosted</option><option>Kilograms Collected</option><option>Cigarette Butts</option><option>Utensils</option><option>6-Pack Holders</option><option>Straws</option><option>Plastic Bags</option></select>
<div class="label">Measure</div><div class="seg"><button id="mean">Mean per Year</button><button id="total" class="on">Total Cleanups</button></div>
<div class="label">Year Analysis</div><div class="seg"><button id="single" class="on">Single Year</button><button id="grouped">Grouped Years</button></div>
<div class="rangebox"><div class="track"></div><input id="r1" type="range" min="2018" max="2025" value="2025" step="1"><input id="r2" type="range" min="2018" max="2025" value="2025" step="1"></div><div class="years"><span id="yl">2025</span><span id="yr">2025</span></div>
<div id="legend" class="legend"></div><div class="hint">Click a geography for its selected value.</div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="data.js"></script><script>
const YEARS=[2018,2019,2020,2021,2022,2023,2024,2025],COL=['#DBDFEF','#B7C0DF','#929FCE','#6E7FBC','#4B5EAA'];
const CFG={
'Cleanups Hosted':{f:'Cleanup_Count',mean:[0,1,2,5,10],total:[0,2,5,20,100]},
'Kilograms Collected':{f:'Kilograms',mean:[0,10,25,50,150],total:[0,25,100,500,2500]},
'Cigarette Butts':{f:'Cigarette Butts',mean:[0,10,50,150,500],total:[0,50,250,1000,5000]},
'Takeout Containers':{f:'Takeout Containers',mean:[0,1,2,5,10],total:[0,5,25,100,500],since:2021},
'Utensils':{f:'Utensils',mean:[0,1,2,5,10],total:[0,5,25,100,500]},
'Coffee Cups & Lids':{f:'Coffee Cups & Lids',mean:[0,2,5,10,25],total:[0,10,50,250,1000],since:2021},
'6-Pack Holders':{f:'Six Pack Holders',mean:[0,.5,1,2,5],total:[0,1,5,25,100]},
'Straws':{f:'Straws',mean:[0,2,5,10,25],total:[0,10,50,250,1000]},
'Plastic Bags':{f:'Plastic Bags',mean:[0,2,5,10,25],total:[0,10,50,250,1000]}}
let S={g:'toronto',m:'Cleanups Hosted',measure:'total',mode:'single',a:2025,b:2025};
const map=L.map('map',{zoomControl:true}).setView([44.5,-79.4],6);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);let layer;
function geo(){return S.g==='toronto'?GEO_TORONTO:GEO_ONTARIO}function years(){return YEARS.filter(y=>y>=S.a&&y<=S.b)}
function value(id){let c=CFG[S.m],ys=years().filter(y=>!c.since||y>=c.since),tot=0,n=0,seen=false;for(let y of ys){let p=SUMMARY[S.g][y]?.[id];if(!p)continue;let q=+p.Cleanup_Count_sum||0;if(S.m==='Cleanups Hosted'){if(q>0){tot+=q;seen=true}continue}let v=p[c.f+'_sum'];if(typeof v==='number'&&q>0){tot+=v;n+=q;seen=true}}if(!seen)return null;if(S.m==='Cleanups Hosted')return S.measure==='total'?tot:tot/ys.length;return S.measure==='total'?tot:tot/n}
function breaks(){return CFG[S.m][S.measure==='total'?'total':'mean']}function cls(v){let b=breaks();if(v==null)return -1;for(let i=4;i>=0;i--)if(v>=b[i])return i;return 0}function fmt(v){if(v==null)return 'No Data';return Number.isInteger(v)?v.toLocaleString():v.toLocaleString(undefined,{maximumFractionDigits:2})}
function redraw(fit=false){if(layer)map.removeLayer(layer);layer=L.geoJSON(geo(),{style:f=>{let i=cls(value(f.properties.id));return{color:'#3d4854',weight:.7,fillColor:i<0?'#d7d7d7':COL[i],fillOpacity:i<0?.35:.65}},onEachFeature:(f,l)=>{let v=value(f.properties.id);l.bindPopup('<b>'+f.properties.name+'</b><br>'+S.m+'<br><strong>'+fmt(v)+'</strong><br><span style="color:#68717c">'+(S.mode==='single'?S.a:S.a+'–'+S.b)+'</span>');l.on('mouseover',()=>l.setStyle({weight:2}));l.on('mouseout',()=>layer.resetStyle(l))}}).addTo(map);if(fit)map.fitBounds(layer.getBounds(),{padding:[20,20]});legend()}
function legend(){let b=breaks(),h='<b>'+S.m+'</b><br><span style="font-size:11px;color:#68717c">'+measureLabel()+'</span>';for(let i=0;i<5;i++){let lab=i===4?fmt(b[i])+'+':fmt(b[i])+' – '+fmt(b[i+1]);h+='<div class="legrow"><span class="sw" style="background:'+COL[i]+'a6"></span>'+lab+'</div>'}h+='<div class="legrow"><span class="sw" style="background:#d7d7d759"></span>No Data</div>';document.getElementById('legend').innerHTML=h}
function measureLabel(){if(S.m==='Cleanups Hosted')return S.measure==='mean'?'Mean per Year':'Total Cleanups';return S.measure==='mean'?'Mean per Cleanup':'Total Collected'}
function syncMeasure(){document.getElementById('mean').textContent=S.m==='Cleanups Hosted'?'Mean per Year':'Mean per Cleanup';document.getElementById('total').textContent=S.m==='Cleanups Hosted'?'Total Cleanups':'Total Collected'}
function setOn(a,b,which){a.classList.toggle('on',which===a);b.classList.toggle('on',which===b)}
const gt=document.getElementById('gt'),go=document.getElementById('go'),mean=document.getElementById('mean'),total=document.getElementById('total'),single=document.getElementById('single'),grouped=document.getElementById('grouped'),r1=document.getElementById('r1'),r2=document.getElementById('r2');
gt.onclick=()=>{S.g='toronto';setOn(gt,go,gt);redraw(true)};go.onclick=()=>{S.g='ontario';setOn(gt,go,go);redraw(true)};document.getElementById('metric').onchange=e=>{S.m=e.target.value;syncMeasure();redraw()};mean.onclick=()=>{S.measure='mean';setOn(mean,total,mean);redraw()};total.onclick=()=>{S.measure='total';setOn(mean,total,total);redraw()};single.onclick=()=>{S.mode='single';S.b=S.a;setOn(single,grouped,single);r2.value=S.b;redraw();showYears()};grouped.onclick=()=>{S.mode='grouped';setOn(single,grouped,grouped);redraw()};function showYears(){document.getElementById('yl').textContent=S.a;document.getElementById('yr').textContent=S.mode==='single'?'':S.b}
r1.oninput=()=>{S.a=+r1.value;if(S.mode==='single'){S.b=S.a;r2.value=S.a}else if(S.a>S.b){S.b=S.a;r2.value=S.a}showYears();redraw()};r2.oninput=()=>{if(S.mode==='single'){S.a=S.b=+r2.value;r1.value=S.a}else{S.b=+r2.value;if(S.b<S.a){S.a=S.b;r1.value=S.b}}showYears();redraw()};
const search=document.getElementById('search'),res=document.getElementById('results');search.oninput=()=>{let q=search.value.trim().toLowerCase();if(!q){res.style.display='none';return}let a=geo().features.filter(f=>f.properties.name.toLowerCase().includes(q)).slice(0,8);res.innerHTML=a.map((f,i)=>'<div data-i="'+i+'">'+f.properties.name+'</div>').join('');res.style.display=a.length?'block':'none';[...res.children].forEach((d,i)=>d.onclick=()=>{let f=a[i],target;layer.eachLayer(l=>{if(l.feature.properties.id===f.properties.id)target=l});if(target){map.fitBounds(target.getBounds(),{maxZoom:S.g==='toronto'?14:11,padding:[50,50]});target.openPopup()}search.value=f.properties.name;res.style.display='none'})};syncMeasure();showYears();redraw(true);
</script></body></html>
